<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<!-- Design board from the claude.ai artifact «لوحة هوية رحلة اليوم» (approved). Reference for building, see ../DESIGN.md. -->
<title>شاشة اليوم</title>
</head>
<body>
<style>
@font-face{font-family:'Baloo Bhaijaan 2';font-weight:600 700;src:url(../../app/src/main/res/font/baloo_bold.ttf)}
@font-face{font-family:'Baloo Bhaijaan 2';font-weight:800;src:url(../../app/src/main/res/font/baloo_extrabold.ttf)}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:400 500;src:url(../../app/src/main/res/font/plex_regular.ttf)}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:600;src:url(../../app/src/main/res/font/plex_semibold.ttf)}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:700 800;src:url(../../app/src/main/res/font/plex_bold.ttf)}
</style>
<style>
body{margin:0}
a{color:#2F56D9}a:hover{color:#1C2340}
</style>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F7FE; color: #1C2340; font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #2F56D9; color: #FFFFFF; padding: 18px 18px 0; display: flex; flex-direction: column; gap: 6px; border-radius: 0 0 30px 30px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column">
        <span style="font-family: 'Baloo Bhaijaan 2', sans-serif; font-size: 30px; font-weight: 800; line-height: 1.1">اليوم</span>
        <span style="font-size: 13px; color: #DCE4FF">الجمعة، 6 نوفمبر</span>
      </div>
      <div style="display: flex; gap: 8px">
        <button aria-label="إضافة مهمة" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #4A6DE6; color: #FFFFFF; font-size: 26px; font-weight: 700">+</button>
        <button aria-label="الإعدادات" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #4A6DE6; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" fill="none" stroke="#FFFFFF" stroke-width="2.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <svg width="354" height="104" viewBox="0 0 354 104" role="img" aria-label="قوس اليوم: انت بالعصر، باقي ساعتين و25 دقيقة للمغرب">
      <path d="M336 96 Q177 -14 18 96" fill="none" stroke="#5B78EC" stroke-width="8" stroke-linecap="round"/>
      <path d="M336 96 Q260 30 196 26" fill="none" stroke="#FFD25E" stroke-width="8" stroke-linecap="round"/>
      <g stroke="#1C2340" stroke-width="2.5">
        <circle cx="336" cy="96" r="7" fill="#5B6BC0"/><circle cx="258" cy="40" r="7" fill="#E0A030"/><circle cx="110" cy="38" r="7" fill="#C0587A"/><circle cx="18" cy="96" r="7" fill="#3B4A8C"/>
      </g>
      <g transform="translate(176 4) scale(.24)">
        <g stroke="#1C2340" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
          <path d="M56 40 L104 40 L96 24 L64 24 Z" fill="#FFB020"/>
          <rect x="34" y="40" width="92" height="114" rx="30" fill="#FF8A3D"/>
          <rect x="50" y="58" width="60" height="72" rx="22" fill="#FFE08A"/>
          <ellipse cx="68" cy="92" rx="6" ry="8" fill="#1C2340" stroke="none"/><ellipse cx="92" cy="92" rx="6" ry="8" fill="#1C2340" stroke="none"/>
          <path d="M70 106 Q80 116 90 106" fill="none"/>
          <rect x="46" y="152" width="68" height="16" rx="8" fill="#FFB020"/>
        </g>
      </g>
      <text x="177" y="92" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="IBM Plex Sans Arabic, Tahoma">العصر · باقي 2 س 25 د للمغرب</text>
    </svg>
  </div>

  <div style="padding: 0 16px; margin-top: -14px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; overflow: hidden">
    <div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 6px 18px rgba(28, 35, 64, .10)">
      <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#DDE8FF"/><g stroke="#1C2340" stroke-width="2.6" stroke-linejoin="round"><path d="M12 44 L32 36 L52 44 L52 50 L32 42 L12 50 Z" fill="#FF8A3D"/><path d="M32 18 C24 13 16 13 12 15 L12 44 C16 42 24 42 32 47 Z" fill="#FFFFFF"/><path d="M32 18 C40 13 48 13 52 15 L52 44 C48 42 40 42 32 47 Z" fill="#EAF0FF"/></g></svg>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <span style="font-size: 12px; font-weight: 700; color: #B85A1E">هلأ</span>
        <span style="font-family: 'Baloo Bhaijaan 2', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.2">قراءة كتاب</span>
        <span style="font-size: 13px; color: #5F6787">30 د · ٢٠ صفحة</span>
      </div>
      <button style="height: 48px; padding: 0 20px; border-radius: 16px; border: 0; background: #FF8A3D; color: #1C2340; font-family: 'Baloo Bhaijaan 2', sans-serif; font-size: 18px; font-weight: 800">ابدأ</button>
    </div>

    <div role="tablist" aria-label="طريقة العرض" style="display: flex; background: #E3EAFB; border-radius: 16px; padding: 4px; gap: 4px">
      <button role="tab" aria-selected="true" style="flex-grow: 1; height: 40px; border: 0; border-radius: 12px; background: #FFFFFF; color: #2F56D9; font-weight: 700; font-size: 14px">بالمواقيت</button>
      <button role="tab" aria-selected="false" style="flex-grow: 1; height: 40px; border: 0; border-radius: 12px; background: transparent; color: #5F6787; font-weight: 600; font-size: 14px">كل المهام</button>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 2px 4px">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #E0A030"></span>
      <span style="font-weight: 700; font-size: 16px; color: #5F6787">الظهر</span>
      <span style="font-size: 13px; color: #5F6787">11:26</span>
      <span style="flex-grow: 1"></span>
      <span style="font-size: 13px; font-weight: 700; color: #137A53">٢/٢ ✓</span>
    </div>

    <div style="background: #FFF3E4; border-radius: 22px; padding: 10px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 2px 6px">
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #DB7A3C"></span>
        <span style="font-weight: 800; font-size: 18px; font-family: 'Baloo Bhaijaan 2', sans-serif">العصر</span>
        <span style="font-size: 13px; color: #5F6787">2:28 · الآن</span>
        <span style="flex-grow: 1"></span>
        <button aria-label="إضافة مهمة للعصر" style="width: 36px; height: 36px; border-radius: 12px; border: 0; background: #FFFFFF; color: #B85A1E; font-size: 22px; font-weight: 700">+</button>
      </div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#EDE7FF"/><g stroke="#1C2340" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><rect x="15" y="7" width="10" height="17" rx="5" fill="#C9CEDD"/><path d="M11 20 C11 29 29 29 29 20 M20 27 V33 M15 33 H25" fill="none"/></g></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 15px">بودكاست التاريخ: البحث</span><span style="font-size: 12px; color: #5F6787">1 س · حلقة ٧</span></div>
        <button aria-label="علّمها منجزة" style="width: 44px; height: 44px; border-radius: 22px; border: 3px solid #C9D2EA; background: #FFFFFF"></button>
      </div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#FFF0C2"/><g stroke="#1C2340" stroke-width="2.2" stroke-linejoin="round"><ellipse cx="20" cy="22" rx="11" ry="9" fill="#FFD25E"/><path d="M28 15 c3 -4 7 -4 9 -2" fill="#3FBF7F"/><ellipse cx="17" cy="21" rx="1.5" ry="2" fill="#1C2340" stroke="none"/><ellipse cx="23" cy="21" rx="1.5" ry="2" fill="#1C2340" stroke="none"/></g></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 15px">Lemonat: تطوير اللعبة</span><span style="font-size: 12px; color: #5F6787">1 س 30 د</span></div>
        <button aria-label="علّمها منجزة" style="width: 44px; height: 44px; border-radius: 22px; border: 3px solid #C9D2EA; background: #FFFFFF"></button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 2px 4px">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #C0587A"></span>
      <span style="font-weight: 700; font-size: 16px">المغرب</span>
      <span style="font-size: 13px; color: #5F6787">4:53</span>
      <span style="flex-grow: 1"></span>
      <span style="font-size: 13px; color: #5F6787">١ مهمة</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; border: 2px solid #F6DCE6">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#D8F2EE"/><g stroke="#1C2340" stroke-width="2.2" stroke-linejoin="round"><path d="M20 12 C15 9 10 9 7 10 L7 28 C10 27 15 27 20 30 Z" fill="#FFFFFF"/><path d="M20 12 C25 9 30 9 33 10 L33 28 C30 27 25 27 20 30 Z" fill="#EAF0FF"/></g></svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 15px">ورد القرآن: ص 93–96</span><span style="font-size: 12px; color: #5F6787">٤ صفحات</span></div>
      <button aria-label="علّمها منجزة" style="width: 44px; height: 44px; border-radius: 22px; border: 3px solid #C9D2EA; background: #FFFFFF"></button>
    </div>
  </div>

  <nav aria-label="التنقل" style="background: #FFFFFF; display: flex; justify-content: space-around; padding: 8px 8px 14px; border-top: 1px solid #E3EAFB">
    <a href="#" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #2F56D9; font-size: 12px; font-weight: 700">
      <span style="width: 56px; height: 36px; border-radius: 14px; background: #EAF0FF; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true"><g stroke="#1C2340" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 30 H36" fill="none"/><path d="M9 30 A11 11 0 0 1 31 30 Z" fill="#FFD25E"/><path d="M20 6 v5 M8 12 l3 3 M32 12 l-3 3" fill="none"/></g></svg></span>اليوم</a>
    <a href="#" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #5F6787; font-size: 12px">
      <span style="height: 36px; display: flex; align-items: center"><svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true"><g stroke="#1C2340" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"><rect x="5" y="8" width="30" height="27" rx="7" fill="#FFFFFF"/><path d="M5 15 H35 M13 4 v7 M27 4 v7" fill="none"/><circle cx="13" cy="23" r="2.5" fill="#FF8A3D"/><circle cx="20" cy="27" r="2.5" fill="#9DB4FF"/></g></svg></span>التخطيط</a>
    <a href="#" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #5F6787; font-size: 12px">
      <span style="height: 36px; display: flex; align-items: center"><svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true"><g stroke="#1C2340" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 35 L16 12 L23 22 L27 16 L37 35 Z" fill="#9DB4FF"/><path d="M27 16 V4 L35 7 L27 10" fill="#FF8A3D"/></g></svg></span>الأهداف</a>
    <a href="#" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #5F6787; font-size: 12px">
      <span style="height: 36px; display: flex; align-items: center"><svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true"><g stroke="#1C2340" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"><rect x="5" y="20" width="7" height="14" rx="2" fill="#9DB4FF"/><rect x="16.5" y="13" width="7" height="21" rx="2" fill="#9DB4FF"/><rect x="28" y="7" width="7" height="27" rx="2" fill="#5A3DB8"/></g></svg></span>المراجعة</a>
  </nav>
</div>
</body>
</html>
