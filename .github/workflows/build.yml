name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle testReleaseUnitTest --console=plain 2>&1 | tee build.log

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --console=plain 2>&1 | tee -a build.log

      - name: Report errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |What went wrong|FAILED|Exception|> .*" build.log | grep -v "^> Task" | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          awk '/What went wrong/{f=1} f{print} /Try:/{f=0}' build.log | head -30 | while IFS= read -r line; do
            echo "::warning::${line//%/%25}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Smart-Life-Planner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Life-Planner
          path: Smart-Life-Planner.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Smart Life Planner build ${{ github.run_number }}
          files: Smart-Life-Planner.apk
          make_latest: true
