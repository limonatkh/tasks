name: Emulator screens

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in scripts/ to run on the emulator"
        default: "screens.sh"
      old:
        description: "Release whose APK is installed first, to check the update (check10: build-68 = 0.33)"
        default: "build-68"

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Firebase config (from the GOOGLE_SERVICES_JSON secret, never in git)
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          [ -n "$GOOGLE_SERVICES_JSON" ] || { echo "::error::GOOGLE_SERVICES_JSON secret is missing"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/google-services.json

      - name: Build
        run: gradle assembleRelease --console=plain
      - name: Sign
        env:
          PLANNER_KS_PASS: ${{ secrets.PLANNER_KS_PASS }}
          MAKE_ATTACK: "1"
        run: bash scripts/sign.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Previous release (to check the upgrade)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download ${{ inputs.old }} -p Smart-Life-Planner.apk -O old.apk -R ${{ github.repository }} || true
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/${{ inputs.script }}
      - name: Pack
        if: always()
        run: cd shots && zip -r ../screens.zip . || true
      - name: Publish
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: screens-${{ github.run_number }}
          name: screens ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: screens.zip
